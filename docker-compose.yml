services:
  db:
    image: postgres:alpine
    container_name: tome-db
    environment:
      POSTGRES_DB: tome
      POSTGRES_USER: brandon
      POSTGRES_PASSWORD: sanderson
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tome-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: "${DATABASE_DRIVER}://${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_NAME}"
    ports:
      - "${API_PORT}:8080"
    depends_on:
      - db
    volumes:
      - ./:/home/gradle/src
      - gradle-cache:/home/gradle/.gradle
    networks:
      - tome-network


volumes:
  postgres_data:
  gradle-cache:

networks:
  tome-network:
    driver: bridge

